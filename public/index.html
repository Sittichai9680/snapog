<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Formatter Online — Pretty Print, Minify, Validate</title>
<meta name="description" content="Free online JSON formatter. Paste JSON to pretty print, minify, or validate. No server, no signup, runs entirely in your browser.">
<meta name="keywords" content="json formatter,json pretty printer,json minifier,json validator,online json tool">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
--accent:#58a6ff;--success:#3fb950;--error:#f85149;--key:#79c0ff;--string:#a5d6ff;
--number:#d2a8ff;--bool:#ffa657;--null:#8b949e}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,sans-serif;
background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{padding:.75rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem;flex-shrink:0}
h1{font-size:1.15rem;font-weight:600;white-space:nowrap}
.badge{font-size:.6rem;background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;font-weight:700;text-transform:uppercase}
.toolbar{display:flex;gap:.35rem;margin-left:auto;flex-wrap:wrap;align-items:center}
button{background:var(--surface);color:var(--text);border:1px solid var(--border);
padding:.3rem .7rem;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:500;transition:all .15s}
button:hover{border-color:var(--accent);background:#1c2333}
.indent-btns{display:flex;gap:.2rem;margin-left:.25rem}
.indent-btns button{padding:.15rem .45rem;font-size:.7rem}
.indent-btns button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.main{flex:1;display:flex;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column;min-width:0}
.label{padding:.4rem 1rem;background:var(--surface);border-bottom:1px solid var(--border);
font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center}
textarea{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;
padding:.75rem 1rem;font-family:"SF Mono",Monaco,Menlo,monospace;font-size:.82rem;
resize:none;outline:none;line-height:1.6;tab-size:2}
textarea::placeholder{color:var(--muted)}
#output{flex:1;padding:.75rem 1rem;font-family:"SF Mono",Monaco,Menlo,monospace;font-size:.82rem;
line-height:1.6;white-space:pre-wrap;word-break:break-all;overflow-y:auto;cursor:text;user-select:text}
.status{padding:.3rem 1rem;font-size:.72rem;border-top:1px solid var(--border);flex-shrink:0}
.status.ok{color:var(--success)}.status.err{color:var(--error)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--success);
color:#fff;padding:.4rem 1rem;border-radius:6px;font-size:.8rem;opacity:0;
transition:opacity .2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
@media(max-width:768px){.main{flex-direction:column}}
.json-key{color:var(--key)}.json-string{color:var(--string)}.json-number{color:var(--number)}
.json-boolean{color:var(--bool)}.json-null{color:var(--null)}
footer{text-align:center;padding:.5rem;color:var(--muted);font-size:.7rem;border-top:1px solid var(--border)}
kbd{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:0 4px;font-size:.75em;font-family:inherit}
</style>
</head>
<body>
<header>
  <h1>JSON Formatter<span class="badge">free</span></h1>
  <div class="toolbar">
    <button id="formatBtn" title="Ctrl+Enter">Pretty Print</button>
    <button id="minifyBtn">Minify</button>
    <button id="validateBtn">Validate</button>
    <button id="copyBtn">Copy</button>
    <button id="clearBtn">Clear</button>
    <div class="indent-btns">
      <button data-spaces="2" class="active">2sp</button>
      <button data-spaces="4">4sp</button>
      <button data-tabs>Tab</button>
    </div>
  </div>
</header>
<div class="main">
  <div class="panel">
    <div class="label"><span>Input</span><span id="inputInfo"></span></div>
    <textarea id="input" placeholder='Paste your JSON here...&#10;&#10;{"name":"example","count":42}' spellcheck="false"></textarea>
  </div>
  <div class="panel">
    <div class="label"><span>Output</span><span id="charCount"></span></div>
    <div id="output"></div>
  </div>
</div>
<footer>Runs entirely in your browser &mdash; no data leaves your device. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to format.</footer>
<div class="status ok" id="status">Ready</div>
<div class="toast" id="toast"></div>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var indentType='spaces',indentValue=2;

$('formatBtn').onclick=formatJSON;
$('minifyBtn').onclick=minifyJSON;
$('validateBtn').onclick=validateJSON;
$('copyBtn').onclick=copyToClipboard;
$('clearBtn').onclick=function(){$('input').value='';$('output').innerHTML='';setStatus('Cleared','ok')};

document.querySelectorAll('.indent-btns button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.indent-btns button').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    if(b.dataset.tabs){indentType='tabs'}else{indentType='spaces';indentValue=parseInt(b.dataset.spaces)}
  };
});

function getIndent(){return indentType==='tabs'?'\t':Array(indentValue+1).join(' ')}

$('input').addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();formatJSON()}
  if(e.key==='Tab'&&!e.ctrlKey){
    e.preventDefault();
    var ta=e.target,s=ta.selectionStart,en=ta.selectionEnd;
    ta.value=ta.value.substring(0,s)+getIndent()+ta.value.substring(en);
    ta.selectionStart=ta.selectionEnd=s+(indentType==='tabs'?1:indentValue);
  }
});

function formatJSON(){
  var raw=$('input').value.trim();if(!raw){setStatus('Nothing to format','err');return}
  try{var obj=JSON.parse(raw);var formatted=JSON.stringify(obj,null,getIndent());
    $('output').innerHTML=syntaxHighlight(formatted);
    setStatus('Formatted ('+byteCount(formatted)+' chars)','ok');
    $('charCount').textContent=byteCount(formatted)+' chars';
    updateInputInfo(raw.length);
  }catch(e){setStatus('Invalid JSON: '+e.message,'err')}
}

function minifyJSON(){
  var raw=$('input').value.trim();if(!raw){setStatus('Nothing to minify','err');return}
  try{var obj=JSON.parse(raw);var m=JSON.stringify(obj);
    $('output').textContent=m;setStatus('Minified ('+byteCount(m)+' chars)','ok');
    $('charCount').textContent=byteCount(m)+' chars';updateInputInfo(raw.length);
  }catch(e){setStatus('Invalid JSON: '+e.message,'err')}
}

function validateJSON(){
  var raw=$('input').value.trim();if(!raw){setStatus('Nothing to validate','err');return}
  try{JSON.parse(raw);setStatus('Valid JSON','ok')}
  catch(e){setStatus('Invalid JSON: '+e.message,'err')}
}

function copyToClipboard(){
  var text=$('output').innerText;if(!text)return setStatus('Nothing to copy','err');
  navigator.clipboard.writeText(text).then(function(){showToast('Copied!')}).catch(function(){setStatus('Copy failed','err')});
}

function syntaxHighlight(json){
  return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"([^"\\]*(\\.[^"\\]*)*)"/g,'<span class="json-string">$1</span>')
    .replace(/\b(true|false)\b/g,'<span class="json-boolean">$1</span>')
    .replace(/\b(null)\b/g,'<span class="json-null">$1</span>')
    .replace(/\b(-?\d+\.?\d*(?:[eE][+-]?\d+)?)\b/g,'<span class="json-number">$1</span>')
    .replace(/^(\s*)([^{}\[\]"]+)\s*:/gm,'$1<span class="json-key">$2</span>:');
}

function setStatus(msg,type){var s=$('status');s.textContent=msg;s.className='status '+type}
function byteCount(s){try{return new Blob([s]).size}catch(e){return s.length}}
function updateInputInfo(len){$('inputInfo').textContent=len?len+' bytes':''}
function showToast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},1500)}

$('input').addEventListener('paste',function(){setTimeout(function(){
  $('inputInfo').textContent=$('input').value.length+' bytes'
},10)});
})();
</script>
</body>
</html>
